services:

  # ==========================================================
  # DATABASE - MARIADB
  # ==========================================================

  database:

    # MariaDB version
    image: mariadb:12.3.2

    # Container name
    container_name: systemanagercv-db

    # ========================================================
    # DATABASE CONFIGURATION
    # ========================================================

    environment:

      # Root password lấy từ .env (chi tiết sẽ ở .env và .env sẽ k được up nên github (thông qua .gitignore) để tăng tính bảo mật chỉ có thể show những trường cần thiết qua .env.example)
      MARIADB_ROOT_PASSWORD: ${DB_PASSWORD}

      # Database name lấy từ .env
      MARIADB_DATABASE: ${DB_NAME}

    ports:
      # Windows : Docker
      #
      # HeidiSQL:
      # localhost:3307
      #
      # MariaDB bên trong container:
      # 3306

      - "3307:3306"

    volumes:
      # Persistent database data

      - mariadb_data:/var/lib/mysql

    restart: unless-stopped

    # ========================================================
    # HEALTH CHECK
    # ========================================================

    healthcheck:
      test:
        [
          "CMD",
          "healthcheck.sh",
          "--connect",
          "--innodb_initialized"
        ]

      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 20s

  # ==========================================================
  # OBJECT STORAGE - MINIO
  # ==========================================================

  minio:

    # MinIO image
    image: quay.io/minio/minio:latest

    # Container name
    container_name: systemanagercv-minio

    # ========================================================
    # MINIO CONFIGURATION
    # ========================================================

    environment:

      # MinIO root username
      MINIO_ROOT_USER: ${MINIO_ROOT_USER}

      # MinIO root password
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD}

    # ========================================================
    # PORTS
    # ========================================================

    ports:

      # MinIO API
      # Spring Boot / S3 API
      - "9000:9000"

      # MinIO Web Console
      - "9001:9001"

    # ========================================================
    # PERSISTENT STORAGE
    # ========================================================

    volumes:

      - minio_data:/data

    # ========================================================
    # START MINIO
    # ========================================================

    command: server /data --console-address ":9001"

    restart: unless-stopped


  # ==========================================================
  # SPRING BOOT APPLICATION
  # ==========================================================

  app:

    # Build image từ Dockerfile
    build:
      context: .
      dockerfile: Dockerfile

    # Container name
    container_name: systemanagercv-app

    ports:
      # Windows:Container
      - "8080:8080"

    # ========================================================
    # ENVIRONMENT VARIABLES
    # ========================================================

    environment:

      # ------------------------------------------------------
      # DATABASE
      # ------------------------------------------------------

      DB_URL: jdbc:mariadb://database:3306/${DB_NAME}?useSSL=false
      DB_USERNAME: ${DB_USERNAME}
      DB_PASSWORD: ${DB_PASSWORD}

      # ------------------------------------------------------
      # JWT
      # ------------------------------------------------------

      JWT_SECRET: ${JWT_SECRET}
      JWT_EXPIRATION: ${JWT_EXPIRATION:-3600000}

      # ------------------------------------------------------
      # MINIO
      # ------------------------------------------------------

      MINIO_ENDPOINT: http://minio:9000
      MINIO_ROOT_USER: ${MINIO_ROOT_USER}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD}
      MINIO_BUCKET: ${MINIO_BUCKET}

    # ========================================================
    # DATABASE DEPENDENCY
    # ========================================================

    depends_on:

      database:
        condition: service_healthy

    restart: unless-stopped


# ==========================================================
# DOCKER VOLUMES
# ==========================================================

volumes:

  mariadb_data:

  minio_data: