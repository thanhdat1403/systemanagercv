<!DOCTYPE html>

<html lang="en">

<head>

    <title>Login - SystemanagerCV</title>

    <meta name="viewport"
          content="width=device-width, initial-scale=1">

    <meta http-equiv="Content-Type"
          content="text/html; charset=utf-8">

    <meta name="keywords"
          content="SystemanagerCV Login">

    <script>
        addEventListener("load", function () {
            setTimeout(hideURLbar, 0);
        }, false);

        function hideURLbar() {
            window.scrollTo(0, 1);
        }
    </script>


    <!-- =========================================================
         BOOTSTRAP CSS
         ========================================================= -->

    <link rel="stylesheet"
          href="../../assets/css/bootstrap.min.css">


    <!-- =========================================================
         CUSTOM CSS
         ========================================================= -->

    <link rel="stylesheet"
          href="../../assets/css/style.css"
          type="text/css">

    <link rel="stylesheet"
          href="../../assets/css/style-responsive.css">


    <!-- =========================================================
         FONT CSS
         ========================================================= -->

    <link rel="stylesheet"
          href="../../assets/css/font.css"
          type="text/css">


    <!-- =========================================================
         FONT AWESOME
         ========================================================= -->

    <link rel="stylesheet"
          href="../../assets/css/font-awesome.css">


    <!-- =========================================================
         JQUERY
         ========================================================= -->

    <script src="../../assets/js/jquery2.0.3.min.js"></script>


    <!-- =========================================================
         GOOGLE FONT
         ========================================================= -->

    <link href="https://fonts.googleapis.com/css?family=Roboto:400,300,500,700,900"
          rel="stylesheet"
          type="text/css">

</head>


<body>

<div class="log-w3">

    <div class="w3layouts-main">

        <h2>Sign In Now</h2>


        <!-- =====================================================
             LOGIN FORM
             ===================================================== -->

        <form id="loginForm">


            <!-- =================================================
                 USERNAME
                 ================================================= -->

            <input type="text"
                   id="username"
                   class="ggg"
                   name="username"
                   placeholder="USERNAME"
                   autocomplete="username"
                   required>


            <!-- =================================================
                 PASSWORD
                 ================================================= -->

            <input type="password"
                   id="password"
                   class="ggg"
                   name="password"
                   placeholder="PASSWORD"
                   autocomplete="current-password"
                   required>


            <!-- =================================================
                 REMEMBER ME
                 ================================================= -->

            <span>

                <input type="checkbox"
                       id="rememberMe">

                Remember Me

            </span>


            <!-- =================================================
                 FORGOT PASSWORD
                 ================================================= -->

            <h6>

                <a href="#">
                    Forgot Password?
                </a>

            </h6>


            <div class="clearfix"></div>


            <!-- =================================================
                 SUBMIT
                 ================================================= -->

            <input type="submit"
                   value="Sign In"
                   name="login"
                   id="loginButton">


            <!-- =================================================
                 LOGIN ERROR
                 ================================================= -->

            <div id="loginError"
                 style="display: none;
                        color: red;
                        margin-top: 15px;">
            </div>


        </form>


        <!-- =====================================================
             REGISTER
             ===================================================== -->

        <p>

            Don't Have an Account ?

            <a href="#">
                Create an account
            </a>

        </p>

    </div>

</div>


<!-- =========================================================
     BOOTSTRAP
     ========================================================= -->

<script src="../../assets/js/bootstrap.js"></script>


<!-- =========================================================
     ACCORDION
     ========================================================= -->

<script src="../../assets/js/jquery.dcjqaccordion.2.7.js"></script>


<!-- =========================================================
     SCRIPTS
     ========================================================= -->

<script src="../../assets/js/scripts.js"></script>


<!-- =========================================================
     SLIMSCROLL
     ========================================================= -->

<script src="../../assets/js/jquery.slimscroll.js"></script>


<!-- =========================================================
     NICE SCROLL
     ========================================================= -->

<script src="../../assets/js/jquery.nicescroll.js"></script>


<!-- =========================================================
     SCROLL TO
     ========================================================= -->

<script src="../../assets/js/jquery.scrollTo.js"></script>


<!-- =========================================================
     LOGIN JAVASCRIPT
     ========================================================= -->

<script src="./login.js"></script>

</body>

</html>
