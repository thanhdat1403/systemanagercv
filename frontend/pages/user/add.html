    <meta charset="UTF-8">

        content="width=device-width, initial-scale=1.0"

    >


    <!-- =========================================================

    <link

    >

    <link

    >

         SYSTEM BASE
         ========================================================= -->

    <link

    >

    >

         COMMON USER PAGE LAYOUT

         Header
         Sidebar
         Main
         Footer
         ========================================================= -->

    >

         USER ADD PAGE

         CSS riêng cho trang Add User
         ========================================================= -->

    <link
        rel="stylesheet"
        href="../../assets/css/user-add.css?v=20261004-final"
    >

</head>


<body class="smcv-app user-add-page">


<section id="container">


    <!-- =========================================================
         HEADER
         ========================================================= -->

    <div id="header-container"></div>


    <!-- =========================================================
         SIDEBAR
         ========================================================= -->

    <div id="sidebar-container"></div>


    <!-- =========================================================
         MAIN CONTENT
         ========================================================= -->

    <section id="main-content">


        <section class="wrapper user-add-wrapper">


            <div class="user-add-card">


                <!-- =================================================
                     HEADER CARD
                     ================================================= -->

                <div class="user-add-header">


                    <div class="user-add-header-left">


                        <div class="user-add-header-icon">

                            <i class="fa fa-user-plus"></i>

                        </div>


                        <div class="user-add-header-content">

                            <h3 class="user-add-title">
                                Thêm người dùng
                            </h3>

                            <p class="user-add-subtitle">
                                Thêm tài khoản người dùng mới vào hệ thống
                            </p>

                        </div>


                    </div>


                </div>


                <!-- =================================================
                     BODY
                     ================================================= -->

                <div class="user-add-body">


                    <!-- =================================================
                         ERROR
                         ================================================= -->

                    <div
                        id="user-error"
                        class="alert alert-danger user-add-message"
                        style="display: none;"
                    ></div>


                    <!-- =================================================
                         SUCCESS
                         ================================================= -->

                    <div
                        id="user-success"
                        class="alert alert-success user-add-message"
                        style="display: none;"
                    ></div>


                    <!-- =================================================
                         FORM
                         ================================================= -->

                    <form
                        id="user-add-form"
                        class="user-add-form"
                        novalidate
                    >


                        <!-- =================================================
                             USERNAME
                             ================================================= -->

                        <div class="form-group user-add-field">


                            <label for="username">

                                Tên đăng nhập

                                <span class="required">
                                    *
                                </span>

                            </label>


                            <div class="form-input-wrapper">


                                <i
                                    class="fa fa-user form-input-icon"
                                ></i>


                                <input
                                    type="text"
                                    id="username"
                                    class="form-control"
                                    placeholder="Nhập tên đăng nhập..."
                                    autocomplete="off"
                                    maxlength="100"
                                    required
                                >


                            </div>


                        </div>


                        <!-- =================================================
                             FULL NAME
                             ================================================= -->

                        <div class="form-group user-add-field">


                            <label for="fullName">

                                Họ và tên

                                <span class="required">
                                    *
                                </span>

                            </label>


                            <div class="form-input-wrapper">


                                <i
                                    class="fa fa-id-card form-input-icon"
                                ></i>


                                <input
                                    type="text"
                                    id="fullName"
                                    class="form-control"
                                    placeholder="Ví dụ: Đỗ Thành Đạt"
                                    autocomplete="name"
                                    maxlength="255"
                                    required
                                >


                            </div>


                        </div>


                        <!-- =================================================
                             EMAIL
                             ================================================= -->

                        <div class="form-group user-add-field">


                            <label for="email">

                                Email

                            </label>


                            <div class="form-input-wrapper">


                                <i
                                    class="fa fa-envelope form-input-icon"
                                ></i>


                                <input
                                    type="email"
                                    id="email"
                                    class="form-control"
                                    placeholder="example@company.com"
                                    autocomplete="email"
                                    maxlength="255"
                                >


                            </div>


                        </div>


                        <!-- =================================================
                             PASSWORD
                             ================================================= -->

                        <div class="form-group user-add-field">


                            <label for="password">

                                Mật khẩu

                                <span class="required">
                                    *
                                </span>

                            </label>


                            <div class="form-input-wrapper">


                                <i
                                    class="fa fa-lock form-input-icon"
                                ></i>


                                <input
                                    type="password"
                                    id="password"
                                    class="form-control"
                                    placeholder="Nhập mật khẩu..."
                                    autocomplete="new-password"
                                    minlength="6"
                                    maxlength="255"
                                    required
                                >


                            </div>


                        </div>


                        <!-- =================================================
                             CONFIRM PASSWORD
                             ================================================= -->

                        <div class="form-group user-add-field">


                            <label for="confirmPassword">

                                Xác nhận mật khẩu

                                <span class="required">
                                    *
                                </span>

                            </label>


                            <div class="form-input-wrapper">


                                <i
                                    class="fa fa-lock form-input-icon"
                                ></i>


                                <input
                                    type="password"
                                    id="confirmPassword"
                                    class="form-control"
                                    placeholder="Nhập lại mật khẩu..."
                                    autocomplete="new-password"
                                    required
                                >


                            </div>


                        </div>


                        <!-- =================================================
                             ROLE
                             ================================================= -->

                        <div class="form-group user-add-field">


                            <label for="roleId">

                                Quyền

                                <span class="required">
                                    *
                                </span>

                            </label>


                            <div class="form-input-wrapper">


                                <i
                                    class="fa fa-shield form-input-icon"
                                ></i>


                                <select
                                    id="roleId"
                                    class="form-control category-select"
                                    required
                                >

                                    <option value="">
                                        -- Chọn quyền --
                                    </option>

                                </select>


                            </div>


                        </div>


                        <!-- =================================================
                             ENABLED
                             ================================================= -->

                        <div class="form-group user-add-field">


                            <label for="enabled">

                                Trạng thái

                                <span class="required">
                                    *
                                </span>

                            </label>


                            <div class="form-input-wrapper">


                                <i
                                    class="fa fa-toggle-on form-input-icon"
                                ></i>


                                <select
                                    id="enabled"
                                    class="form-control category-select"
                                    required
                                >

                                    <option value="true">
                                        Hoạt động
                                    </option>

                                    <option value="false">
                                        Không hoạt động
                                    </option>

                                </select>


                            </div>


                        </div>


                        <!-- =================================================
                             ACTIONS
                             ================================================= -->

                        <div class="user-add-form-footer">


                            <a
                                href="./index.html"
                                class="user-add-btn user-add-btn-back"
                            >

                                <i class="fa fa-arrow-left"></i>

                                <span>
                                    Quay lại
                                </span>

                            </a>


                            <button
                                type="reset"
                                id="user-reset"
                                class="user-add-btn user-add-btn-reset"
                            >

                                <i class="fa fa-refresh"></i>

                                <span>
                                    Nhập lại
                                </span>

                            </button>


                            <button
                                type="submit"
                                class="user-add-btn user-add-btn-save"
                            >

                                <i class="fa fa-save"></i>

                                <span>
                                    Lưu người dùng
                                </span>

                            </button>


                        </div>


                    </form>


                </div>


            </div>


        </section>


    </section>


    <!-- =========================================================
         FOOTER
         ========================================================= -->

    <div id="footer-container"></div>
