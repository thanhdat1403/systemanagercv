spring.application.name=systemanagercv

# 1. Đường dẫn kết nối chuẩn MariaDB (Đã sửa thành systemcv_db theo ảnh HeidiSQL của bạn)
spring.datasource.url=jdbc:mariadb://localhost:3306/systemcv_db?useSSL=false&serverTimezone=UTC
spring.datasource.username=root
spring.datasource.password=123456

# 2. Ép Hibernate nhận diện chính xác hệ cơ sở dữ liệu MariaDB
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MariaDBDialect

# 3. Cấu hình tự động đồng bộ bảng dữ liệu
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
