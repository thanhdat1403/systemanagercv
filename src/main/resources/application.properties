# LOAD LOCAL ENVIRONMENT
spring.config.import=optional:file:.env.local[.properties]

# =====================================================
# APPLICATION
# =====================================================

spring.application.name=systemanagercv


# =====================================================
# JWT
# =====================================================

jwt.secret=${JWT_SECRET}
jwt.expiration=${JWT_EXPIRATION:3600000}


# =====================================================
# DATABASE - MARIADB
# =====================================================

spring.datasource.url=${DB_URL}
spring.datasource.username=${DB_USERNAME}
spring.datasource.password=${DB_PASSWORD}

# =====================================================
# MINIO OBJECT STORAGE
# =====================================================

minio.endpoint=${MINIO_ENDPOINT}
minio.access-key=${MINIO_ROOT_USER}
minio.secret-key=${MINIO_ROOT_PASSWORD}
minio.bucket=${MINIO_BUCKET}

# =====================================================
# JPA / HIBERNATE
# =====================================================

spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MariaDBDialect
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.show-sql=true


# =====================================================
# LIQUIBASE
# =====================================================

spring.liquibase.enabled=true
spring.liquibase.change-log=classpath:db/changelog/db.changelog-master.yaml


# =====================================================
# LIQUIBASE DEBUG
# =====================================================

logging.level.liquibase=DEBUG
logging.level.org.springframework.boot.autoconfigure.liquibase=DEBUG


# =====================================================
# DEBUG
# =====================================================

debug=true