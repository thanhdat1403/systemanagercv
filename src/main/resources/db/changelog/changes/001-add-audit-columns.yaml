databaseChangeLog:

  - changeSet:
      id: 001-add-audit-columns-users
      author: systemanagercv

      changes:

        - addColumn:
            tableName: users
            columns:

              - column:
                  name: created_date
                  type: datetime

              - column:
                  name: created_by
                  type: varchar(100)

              - column:
                  name: updated_date
                  type: datetime

              - column:
                  name: updated_by
                  type: varchar(100)

              - column:
                  name: is_deleted
                  type: boolean
                  defaultValueBoolean: false
                  constraints:
                    nullable: false