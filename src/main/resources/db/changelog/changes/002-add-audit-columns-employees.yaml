databaseChangeLog:

  - changeSet:
      id: 002-add-audit-columns-employees
      author: systemanagercv

      changes:

        # =====================================================
        # ĐỔI created_at → created_date
        # =====================================================

        - renameColumn:
            tableName: employees
            oldColumnName: created_at
            newColumnName: created_date
            columnDataType: datetime

        # =====================================================
        # ĐỔI updated_at → updated_date
        # =====================================================

        - renameColumn:
            tableName: employees
            oldColumnName: updated_at
            newColumnName: updated_date
            columnDataType: datetime

        # =====================================================
        # THÊM created_by
        # =====================================================

        - addColumn:
            tableName: employees
            columns:

              - column:
                  name: created_by
                  type: varchar(100)

        # =====================================================
        # THÊM updated_by
        # =====================================================

        - addColumn:
            tableName: employees
            columns:

              - column:
                  name: updated_by
                  type: varchar(100)

        # =====================================================
        # THÊM is_deleted
        # =====================================================

        - addColumn:
            tableName: employees
            columns:

              - column:
                  name: is_deleted
                  type: boolean
                  defaultValueBoolean: false
                  constraints:
                    nullable: false