databaseChangeLog:
  - changeSet: 
      id: cv-002-create-cv-versions
      author: systemanagercv

      changes:
        - createTable:
            tableName: cv_versions
            columns:
              - column:
                  name: id
                  type: BIGINT
                  autoIncrement: true
                  constraints:
                    primaryKey: true
                    nullable: false

              - column:
                  name: employee_cv_id
                  type: BIGINT
                  constraints:
                    nullable: false

              - column:
                  name: version
                  type: VARCHAR(20)
                  constraints:
                    nullable: false

              - column:
                  name: status
                  type: VARCHAR(30)
                  defaultValue: DRAFT
                  constraints:
                    nullable: false

              - column:
                  name: is_current
                  type: BOOLEAN
                  defaultValueBoolean: false
                  constraints:
                    nullable: false

              - column:
                  name: created_date
                  type: DATETIME
                  constraints:
                    nullable: false

              - column:
                  name: created_by
                  type: VARCHAR(100)

              - column:
                  name: updated_date
                  type: DATETIME

              - column:
                  name: updated_by
                  type: VARCHAR(100)

              - column:
                  name: is_deleted
                  type: BOOLEAN
                  defaultValueBoolean: false
                  constraints:
                    nullable: false

        - addForeignKeyConstraint:
            baseTableName: cv_versions
            baseColumnNames: employee_cv_id
            referencedTableName: employee_cvs
            referencedColumnNames: id
            constraintName: fk_cv_versions_employee_cv
            onDelete: RESTRICT

        - addUniqueConstraint:
            tableName: cv_versions
            columnNames: employee_cv_id, version
            constraintName: uk_cv_versions_cv_version

        - createIndex:
            tableName: cv_versions
            indexName: idx_cv_versions_status
            columns:
              - column:
                  name: status

        - createIndex:
            tableName: cv_versions
            indexName: idx_cv_versions_current
            columns:
              - column:
                  name: is_current

        - createIndex:
            tableName: cv_versions
            indexName: idx_cv_versions_deleted
            columns:
              - column:
                  name: is_deleted

        - addForeignKeyConstraint:
            baseTableName: employee_cvs
            baseColumnNames: current_version_id
            referencedTableName: cv_versions
            referencedColumnNames: id
            constraintName: fk_employee_cvs_current_version
            onDelete: RESTRICT

