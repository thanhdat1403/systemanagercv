databaseChangeLog:
  - changeSet: 
      id: cv-004-create-cv-skills
      author: systemanagercv

      changes:
        - createTable:
            tableName: cv_skills
            columns:
              - column:
                  name: id
                  type: BIGINT
                  autoIncrement: true
                  constraints:
                    primaryKey: true
                    nullable: false

              - column:
                  name: cv_version_id
                  type: BIGINT
                  constraints:
                    nullable: false

              - column:
                  name: skill_name
                  type: VARCHAR(255)
                  constraints:
                    nullable: false

              - column:
                  name: skill_level
                  type: VARCHAR(50)

              - column:
                  name: description
                  type: TEXT

              - column:
                  name: sort_order
                  type: INT
                  defaultValueNumeric: 0
                  constraints:
                    nullable: false

              - column:
                  name: created_date
                  type: DATETIME
                  constraints:
                    nullable: false

              - column:
                  name: created_by
                  type: VARCHAR(100)

              - column:
                  name: updated_date
                  type: DATETIME

              - column:
                  name: updated_by
                  type: VARCHAR(100)

              - column:
                  name: is_deleted
                  type: BOOLEAN
                  defaultValueBoolean: false
                  constraints:
                    nullable: false

        - addForeignKeyConstraint:
            baseTableName: cv_skills
            baseColumnNames: cv_version_id
            referencedTableName: cv_versions
            referencedColumnNames: id
            constraintName: fk_cv_skills_cv_version
            onDelete: CASCADE

        - createIndex:
            tableName: cv_skills
            indexName: idx_cv_skills_cv_version
            columns:
              - column:
                  name: cv_version_id

        - createIndex:
            tableName: cv_skills
            indexName: idx_cv_skills_deleted
            columns:
              - column:
                  name: is_deleted