databaseChangeLog:

  - changeSet:
      id: cv-009-create-cv-languages
      author: systemanagercv

      changes:

        - createTable:
            tableName: cv_languages
            columns:

              - column:
                  name: id
                  type: BIGINT
                  autoIncrement: true
                  constraints:
                    primaryKey: true
                    nullable: false

              - column:
                  name: cv_version_id
                  type: BIGINT
                  constraints:
                    nullable: false

              - column:
                  name: language_code
                  type: VARCHAR(10)
                  constraints:
                    nullable: false

              - column:
                  name: language_name
                  type: VARCHAR(100)
                  constraints:
                    nullable: false

              - column:
                  name: proficiency
                  type: VARCHAR(50)

              - column:
                  name: sort_order
                  type: INT
                  defaultValueNumeric: 0
                  constraints:
                    nullable: false

              - column:
                  name: created_date
                  type: DATETIME
                  constraints:
                    nullable: false

              - column:
                  name: created_by
                  type: VARCHAR(100)

              - column:
                  name: updated_date
                  type: DATETIME

              - column:
                  name: updated_by
                  type: VARCHAR(100)

              - column:
                  name: is_deleted
                  type: BOOLEAN
                  defaultValueBoolean: false
                  constraints:
                    nullable: false

        - addForeignKeyConstraint:
            baseTableName: cv_languages
            baseColumnNames: cv_version_id
            referencedTableName: cv_versions
            referencedColumnNames: id
            constraintName: fk_cv_languages_cv_version
            onDelete: CASCADE

        - createIndex:
            tableName: cv_languages
            indexName: idx_cv_languages_cv_version
            columns:
              - column:
                  name: cv_version_id

        - createIndex:
            tableName: cv_languages
            indexName: idx_cv_languages_deleted
            columns:
              - column:
                  name: is_deleted