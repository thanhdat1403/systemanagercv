databaseChangeLog:
  - changeSet:
      id: notification-001-create-notifications
      author: systemanagercv

      changes:
        - createTable:
            tableName: notifications

            columns:

              - column:
                  name: id
                  type: BIGINT
                  autoIncrement: true
                  constraints:
                    primaryKey: true
                    nullable: false

              - column:
                  name: recipient_user_id
                  type: BIGINT
                  constraints:
                    nullable: false

              - column:
                  name: type
                  type: VARCHAR(50)
                  constraints:
                    nullable: false

              - column:
                  name: title
                  type: VARCHAR(255)
                  constraints:
                    nullable: false

              - column:
                  name: message
                  type: VARCHAR(2000)
                  constraints:
                    nullable: false

              - column:
                  name: reference_type
                  type: VARCHAR(50)

              - column:
                  name: reference_id
                  type: BIGINT

              - column:
                  name: is_read
                  type: BOOLEAN
                  defaultValueBoolean: false
                  constraints:
                    nullable: false

              - column:
                  name: read_at
                  type: DATETIME

              - column:
                  name: created_date
                  type: DATETIME

              - column:
                  name: created_by
                  type: VARCHAR(255)

              - column:
                  name: updated_date
                  type: DATETIME

              - column:
                  name: updated_by
                  type: VARCHAR(255)

              - column:
                  name: is_deleted
                  type: BOOLEAN
                  defaultValueBoolean: false
                  constraints:
                    nullable: false

        - addForeignKeyConstraint:
            baseTableName: notifications
            baseColumnNames: recipient_user_id
            referencedTableName: users
            referencedColumnNames: id
            constraintName: fk_notifications_recipient_user