databaseChangeLog:

  - changeSet:
      id: 003-add-full-name-to-users
      author: systemanagercv
      changes:

        - addColumn:
            tableName: users
            columns:
              - column:
                  name: full_name
                  type: VARCHAR(255)

      rollback:
        - dropColumn:
            tableName: users
            columnName: full_name