databaseChangeLog:

  # =====================================================
  # USERS
  # =====================================================
  - changeSet:
      id: 001-create-users
      author: systemanagercv

      changes:
        - createTable:
            tableName: users
            columns:
              - column:
                  name: id
                  type: BIGINT
                  autoIncrement: true
                  constraints:
                    primaryKey: true
                    nullable: false

              - column:
                  name: email
                  type: VARCHAR(255)

              - column:
                  name: enabled
                  type: BIT(1)
                  constraints:
                    nullable: false

              - column:
                  name: password
                  type: VARCHAR(255)
                  constraints:
                    nullable: false

              - column:
                  name: username
                  type: VARCHAR(100)
                  constraints:
                    nullable: false

              - column:
                  name: created_date
                  type: DATETIME

              - column:
                  name: created_by
                  type: VARCHAR(100)

              - column:
                  name: updated_date
                  type: DATETIME

              - column:
                  name: updated_by
                  type: VARCHAR(100)

              - column:
                  name: is_deleted
                  type: TINYINT(1)
                  defaultValueNumeric: 0
                  constraints:
                    nullable: false

        - addUniqueConstraint:
            tableName: users
            columnNames: username
            constraintName: uk_users_username

        - addUniqueConstraint:
            tableName: users
            columnNames: email
            constraintName: uk_users_email


  # =====================================================
  # ROLES
  # =====================================================
  - changeSet:
      id: 002-create-roles
      author: systemanagercv

      changes:
        - createTable:
            tableName: roles
            columns:
              - column:
                  name: id
                  type: BIGINT
                  autoIncrement: true
                  constraints:
                    primaryKey: true
                    nullable: false

              - column:
                  name: description
                  type: VARCHAR(255)

              - column:
                  name: name
                  type: VARCHAR(50)
                  constraints:
                    nullable: false

        - addUniqueConstraint:
            tableName: roles
            columnNames: name
            constraintName: uk_roles_name


  # =====================================================
  # USER ROLES
  # =====================================================
  - changeSet:
      id: 003-create-user-roles
      author: systemanagercv

      changes:
        - createTable:
            tableName: user_roles
            columns:
              - column:
                  name: role_id
                  type: BIGINT
                  constraints:
                    nullable: false

              - column:
                  name: user_id
                  type: BIGINT
                  constraints:
                    nullable: false

        - addPrimaryKey:
            tableName: user_roles
            columnNames: role_id,user_id
            constraintName: pk_user_roles

        - addUniqueConstraint:
            tableName: user_roles
            columnNames: user_id
            constraintName: uk_user_roles_user

        - addForeignKeyConstraint:
            baseTableName: user_roles
            baseColumnNames: role_id
            referencedTableName: roles
            referencedColumnNames: id
            constraintName: fk_user_roles_role

        - addForeignKeyConstraint:
            baseTableName: user_roles
            baseColumnNames: user_id
            referencedTableName: users
            referencedColumnNames: id
            constraintName: fk_user_roles_user


  # =====================================================
  # DEPARTMENTS
  # =====================================================
  - changeSet:
      id: 004-create-departments
      author: systemanagercv

      changes:
        - createTable:
            tableName: departments
            columns:
              - column:
                  name: id
                  type: BIGINT
                  autoIncrement: true
                  constraints:
                    primaryKey: true
                    nullable: false

              - column:
                  name: code
                  type: VARCHAR(50)
                  constraints:
                    nullable: false

              - column:
                  name: created_date
                  type: DATETIME

              - column:
                  name: description
                  type: TEXT

              - column:
                  name: name
                  type: VARCHAR(255)
                  constraints:
                    nullable: false

              - column:
                  name: status
                  type: VARCHAR(30)
                  constraints:
                    nullable: false

              - column:
                  name: updated_date
                  type: DATETIME

              - column:
                  name: created_by
                  type: VARCHAR(100)

              - column:
                  name: updated_by
                  type: VARCHAR(100)

              - column:
                  name: is_deleted
                  type: TINYINT(1)
                  defaultValueNumeric: 0
                  constraints:
                    nullable: false

        - addUniqueConstraint:
            tableName: departments
            columnNames: code
            constraintName: uk_departments_code


  # =====================================================
  # EMPLOYEES
  # =====================================================
  - changeSet:
      id: 005-create-employees
      author: systemanagercv

      changes:
        - createTable:
            tableName: employees
            columns:
              - column:
                  name: id
                  type: BIGINT
                  autoIncrement: true
                  constraints:
                    primaryKey: true
                    nullable: false

              - column:
                  name: created_date
                  type: DATETIME

              - column:
                  name: email
                  type: VARCHAR(255)

              - column:
                  name: employee_code
                  type: VARCHAR(50)
                  constraints:
                    nullable: false

              - column:
                  name: full_name
                  type: VARCHAR(255)
                  constraints:
                    nullable: false

              - column:
                  name: job_title
                  type: VARCHAR(150)

              - column:
                  name: join_date
                  type: DATE

              - column:
                  name: phone
                  type: VARCHAR(30)

              - column:
                  name: position
                  type: VARCHAR(100)

              - column:
                  name: status
                  type: VARCHAR(30)
                  constraints:
                    nullable: false

              - column:
                  name: updated_date
                  type: DATETIME

              - column:
                  name: department_id
                  type: BIGINT
                  constraints:
                    nullable: false

              - column:
                  name: user_id
                  type: BIGINT
                  constraints:
                    nullable: false

              - column:
                  name: created_by
                  type: VARCHAR(100)

              - column:
                  name: updated_by
                  type: VARCHAR(100)

              - column:
                  name: is_deleted
                  type: TINYINT(1)
                  defaultValueNumeric: 0
                  constraints:
                    nullable: false

        - addUniqueConstraint:
            tableName: employees
            columnNames: employee_code
            constraintName: uk_employees_employee_code

        - addUniqueConstraint:
            tableName: employees
            columnNames: user_id
            constraintName: uk_employees_user

        - addForeignKeyConstraint:
            baseTableName: employees
            baseColumnNames: department_id
            referencedTableName: departments
            referencedColumnNames: id
            constraintName: fk_employees_department

        - addForeignKeyConstraint:
            baseTableName: employees
            baseColumnNames: user_id
            referencedTableName: users
            referencedColumnNames: id
            constraintName: fk_employees_user