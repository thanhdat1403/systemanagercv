databaseChangeLog:

  - changeSet:
      id: 001-create-cv-update-requests
      author: systemanagercv

      changes:

        - createTable:
            tableName: cv_update_requests
            columns:

              - column:
                  name: id
                  type: BIGINT
                  autoIncrement: true
                  constraints:
                    primaryKey: true
                    nullable: false

              - column:
                  name: employee_cv_id
                  type: BIGINT
                  constraints:
                    nullable: false

              - column:
                  name: requested_by
                  type: BIGINT
                  constraints:
                    nullable: false

              - column:
                  name: status
                  type: VARCHAR(30)
                  constraints:
                    nullable: false

              - column:
                  name: content
                  type: TEXT
                  constraints:
                    nullable: false

              - column:
                  name: deadline
                  type: DATE
                  constraints:
                    nullable: false

              - column:
                  name: created_date
                  type: DATETIME

              - column:
                  name: created_by
                  type: BIGINT

              - column:
                  name: updated_date
                  type: DATETIME

              - column:
                  name: updated_by
                  type: BIGINT

              - column:
                  name: is_deleted
                  type: BOOLEAN
                  defaultValueBoolean: false
                  constraints:
                    nullable: false

        - addForeignKeyConstraint:
            baseTableName: cv_update_requests
            baseColumnNames: employee_cv_id
            referencedTableName: employee_cvs
            referencedColumnNames: id
            constraintName: fk_cv_update_request_employee_cv

        - addForeignKeyConstraint:
            baseTableName: cv_update_requests
            baseColumnNames: requested_by
            referencedTableName: users
            referencedColumnNames: id
            constraintName: fk_cv_update_request_requested_by

      rollback:

        - dropTable:
            tableName: cv_update_requests