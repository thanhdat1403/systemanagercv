
<!DOCTYPE html>
<html lang="vi" xmlns:th="http://www.thymeleaf.org">

<head th:replace="admin/fragments/head :: head"></head>

<body>

<section id="container">

    <!-- ===================================================== -->
    <!-- HEADER -->
    <!-- ===================================================== -->

    <header th:replace="admin/fragments/header :: header"></header>


    <!-- ===================================================== -->
    <!-- SIDEBAR -->
    <!-- ===================================================== -->

    <aside th:replace="admin/fragments/sidebar :: sidebar"></aside>


    <!-- ===================================================== -->
    <!-- MAIN CONTENT -->
    <!-- ===================================================== -->

    <section id="main-content">

        <section class="wrapper category-wrapper">

            <!-- ================================================= -->
            <!-- EMPLOYEE CARD -->
            <!-- ================================================= -->

            <div class="category-card">


                <!-- ================================================= -->
                <!-- PAGE HEADER -->
                <!-- ================================================= -->

                <div class="category-header">

                    <div class="category-header-left">

                        <!-- ICON -->

                        <div class="category-header-icon">

                            <i class="fa fa-user"></i>

                        </div>


                        <!-- TITLE -->

                        <div class="category-header-content">

                            <h3 class="category-title">
                                Thêm nhân viên
                            </h3>

                            <p class="category-subtitle">
                                Thêm thông tin nhân viên mới vào hệ thống
                            </p>

                        </div>

                    </div>

                </div>


                <!-- ================================================= -->
                <!-- EMPLOYEE BODY -->
                <!-- ================================================= -->

                <div class="category-body">


                    <!-- ================================================= -->
                    <!-- THÔNG BÁO LỖI -->
                    <!-- ================================================= -->

                    <div
                            th:if="${error}"
                            class="alert alert-danger">

                        <i class="fa fa-exclamation-circle"></i>

                        <span th:text="${error}">
                            Có lỗi xảy ra
                        </span>

                    </div>


                    <!-- ================================================= -->
                    <!-- FORM -->
                    <!-- ================================================= -->

                    <form
                            th:action="@{/admin/employees/add}"
                            method="post"
                            class="category-form"
                            th:object="${employee}">


                        <!-- ================================================= -->
                        <!-- 1. TÀI KHOẢN ĐĂNG NHẬP -->
                        <!-- ================================================= -->

                        <div class="form-group">

                            <label for="user">

                                Tài khoản đăng nhập

                                <span class="required">*</span>

                            </label>


                            <div class="form-input-wrapper">

                                <i class="fa fa-user form-input-icon"></i>


                                <select id="user"
                                        name="userId"
                                        class="form-control category-select"
                                        required>

                                    <option value="">-- Chọn tài khoản --</option>

                                    <option th:each="u : ${users}"
                                            th:value="${u.id}"
                                            th:text="${u.username}">
                                    </option>

                                </select>

                            </div>


                            <div class="form-help">

                                <i class="fa fa-info-circle"></i>

                                Chọn tài khoản đăng nhập được liên kết với nhân viên.

                            </div>

                        </div>


                        <!-- ================================================= -->
                        <!-- 2. MÃ NHÂN VIÊN -->
                        <!-- ================================================= -->

                        <div class="form-group">

                            <label for="employeeCode">

                                Mã nhân viên

                                <span class="required">*</span>

                            </label>


                            <div class="form-input-wrapper">

                                <i class="fa fa-id-card form-input-icon"></i>


                                <input
                                        type="text"
                                        id="employeeCode"
                                        class="form-control"
                                        th:field="*{employeeCode}"
                                        placeholder="Ví dụ: NV001"
                                        autocomplete="off"
                                        required>

                            </div>

                        </div>


                        <!-- ================================================= -->
                        <!-- 3. HỌ VÀ TÊN -->
                        <!-- ================================================= -->

                        <div class="form-group">

                            <label for="fullName">

                                Họ và tên

                                <span class="required">*</span>

                            </label>


                            <div class="form-input-wrapper">

                                <i class="fa fa-user-o form-input-icon"></i>


                                <input
                                        type="text"
                                        id="fullName"
                                        class="form-control"
                                        th:field="*{fullName}"
                                        placeholder="Nhập họ và tên nhân viên..."
                                        autocomplete="off"
                                        required>

                            </div>

                        </div>


                        <!-- ================================================= -->
                        <!-- 4. EMAIL -->
                        <!-- ================================================= -->

                        <div class="form-group">

                            <label for="email">
                                Email
                            </label>


                            <div class="form-input-wrapper">

                                <i class="fa fa-envelope form-input-icon"></i>


                                <input
                                        type="email"
                                        id="email"
                                        class="form-control"
                                        th:field="*{email}"
                                        placeholder="example@company.com"
                                        autocomplete="off">

                            </div>

                        </div>


                        <!-- ================================================= -->
                        <!-- 5. SỐ ĐIỆN THOẠI -->
                        <!-- ================================================= -->

                        <div class="form-group">

                            <label for="phone">
                                Số điện thoại
                            </label>


                            <div class="form-input-wrapper">

                                <i class="fa fa-phone form-input-icon"></i>


                                <input
                                        type="tel"
                                        id="phone"
                                        class="form-control"
                                        th:field="*{phone}"
                                        placeholder="Nhập số điện thoại..."
                                        autocomplete="off">

                            </div>

                        </div>


                        <!-- ================================================= -->
                        <!-- 6. PHÒNG BAN -->
                        <!-- ================================================= -->

                        <div class="form-group">

                            <label for="department">

                                Phòng ban

                                <span class="required">*</span>

                            </label>


                            <div class="form-input-wrapper">

                                <i class="fa fa-building form-input-icon"></i>


                                <select id="department"
                                        name="departmentId"
                                        class="form-control category-select"
                                        required>

                                    <option value="">
                                        -- Chọn phòng ban --
                                    </option>

                                    <option th:each="dept : ${departments}"
                                            th:value="${dept.id}"
                                            th:text="${dept.name}">
                                    </option>

                                </select>

                            </div>

                        </div>


                        <!-- ================================================= -->
                        <!-- 7. CHỨC VỤ -->
                        <!-- ================================================= -->

                        <div class="form-group">

                            <label for="position">

                                Chức vụ

                                <span class="required">*</span>

                            </label>


                            <div class="form-input-wrapper">

                                <i class="fa fa-briefcase form-input-icon"></i>


                                <select
                                        id="position"
                                        th:field="*{position}"
                                        class="form-control category-select"
                                        required>

                                    <option value="">
                                        -- Chọn chức vụ --
                                    </option>

                                    <option value="NHAN_VIEN">
                                        Nhân viên
                                    </option>

                                    <option value="TRUONG_NHOM">
                                        Trưởng nhóm
                                    </option>

<!--                                    <option value="NHAN_SU">-->
<!--                                        Nhân sự-->
<!--                                    </option>-->

<!--                                    <option value="TRUONG_PHONG">-->
<!--                                        Trưởng phòng-->
<!--                                    </option>-->

                                    <option value="QUAN_LY">
                                        Quản lý
                                    </option>

                                </select>

                            </div>

                        </div>


                        <!-- ================================================= -->
                        <!-- 8. CHỨC DANH -->
                        <!-- ================================================= -->

                        <div class="form-group">

                            <label for="jobTitle">

                                Chức danh

                                <span class="required">*</span>

                            </label>


                            <div class="form-input-wrapper">

                                <i class="fa fa-id-badge form-input-icon"></i>


                                <input
                                        type="text"
                                        id="jobTitle"
                                        class="form-control"
                                        th:field="*{jobTitle}"
                                        placeholder="Ví dụ: Java Developer"
                                        autocomplete="off"
                                        required>

                            </div>

                        </div>


                        <!-- ================================================= -->
                        <!-- 9. NGÀY VÀO LÀM -->
                        <!-- ================================================= -->

                        <div class="form-group">

                            <label for="joinDate">

                                Ngày vào làm

                                <span class="required">*</span>

                            </label>


                            <div class="form-input-wrapper">

                                <i class="fa fa-calendar form-input-icon"></i>


                                <input
                                        type="date"
                                        id="joinDate"
                                        class="form-control"
                                        th:field="*{joinDate}"
                                        required>

                            </div>

                        </div>


                        <!-- ================================================= -->
                        <!-- 10. TRẠNG THÁI -->
                        <!-- ================================================= -->

                        <div class="form-group">

                            <label for="status">

                                Trạng thái

                                <span class="required">*</span>

                            </label>


                            <div class="form-input-wrapper">

                                <i class="fa fa-toggle-on form-input-icon"></i>


                                <select
                                        id="status"
                                        th:field="*{status}"
                                        class="form-control category-select"
                                        required>

                                    <option value="">
                                        -- Chọn trạng thái --
                                    </option>

                                    <option value="ACTIVE">
                                        Hoạt động
                                    </option>

                                    <option value="INACTIVE">
                                        Không hoạt động
                                    </option>

                                </select>

                            </div>

                        </div>


                        <!-- ================================================= -->
                        <!-- FORM FOOTER -->
                        <!-- ================================================= -->

                        <div class="category-form-footer">


                            <!-- QUAY LẠI -->

                            <a
                                    th:href="@{/admin/employees}"
                                    class="category-btn category-btn-back">

                                <i class="fa fa-arrow-left"></i>

                                <span>Quay lại</span>

                            </a>


                            <!-- NHẬP LẠI -->

                            <button
                                    type="reset"
                                    class="category-btn category-btn-reset">

                                <i class="fa fa-refresh"></i>

                                <span>Nhập lại</span>

                            </button>


                            <!-- LƯU -->

                            <button
                                    type="submit"
                                    class="category-btn category-btn-save">

                                <i class="fa fa-save"></i>

                                <span>Lưu nhân viên</span>

                            </button>

                        </div>

                    </form>

                </div>

            </div>


            <!-- ================================================= -->
            <!-- FOOTER -->
            <!-- ================================================= -->

            <div
                    th:replace="admin/fragments/footer :: footer">
            </div>

        </section>

    </section>

</section>


<!-- ===================================================== -->
<!-- JAVASCRIPT -->
<!-- ===================================================== -->

<script
        th:replace="admin/fragments/script :: script">
</script>

</body>

</html>
