<!DOCTYPE html>

<html lang="vi" xmlns:th="http://www.thymeleaf.org">

<head th:replace="admin/fragments/head :: head"></head>

<body>

<section id="container">

    <!-- =====================================================
         HEADER
         ===================================================== -->

    <header th:replace="admin/fragments/header :: header"></header>


    <!-- =====================================================
         SIDEBAR
         ===================================================== -->

    <aside th:replace="admin/fragments/sidebar :: sidebar"></aside>


    <!-- =====================================================
         MAIN CONTENT
         ===================================================== -->

    <section id="main-content">

        <section class="wrapper category-wrapper">

            <!-- =================================================
                 USER EDIT CARD
                 ================================================= -->

            <div class="user-edit-card">

                <!-- =================================================
                     PAGE HEADER
                     ================================================= -->

                <div class="user-edit-header">

                    <div class="user-edit-header-left">

                        <div class="user-edit-icon">
                            <i class="fa fa-user"></i>
                        </div>

                        <div>
                            <h3 class="user-edit-title">
                                Sửa người dùng
                            </h3>

                            <p class="user-edit-subtitle">
                                Cập nhật thông tin tài khoản người dùng
                            </p>
                        </div>

                    </div>

                    <div class="user-edit-id">
                        ID: <strong th:text="${userId}">1</strong>
                    </div>

                </div>


                <!-- =================================================
                     ERROR MESSAGE
                     ================================================= -->

                <div
                        th:if="${error}"
                        class="user-alert user-alert-danger">

                    <i class="fa fa-exclamation-circle"></i>

                    <span th:text="${error}">
                    Có lỗi xảy ra
                </span>

                </div>


                <!-- =================================================
                     FORM
                     ================================================= -->

                <form
                        th:action="@{/admin/users/update/{id}(id=${userId})}"
                        method="post"
                        th:object="${user}"
                        class="user-edit-form">


                    <!-- =================================================
                         ACCOUNT INFORMATION
                         ================================================= -->

                    <div class="user-form-section">

                        <div class="user-form-section-title">

                            <div class="user-section-icon">
                                <i class="fa fa-user"></i>
                            </div>

                            <div>
                                <h4>Thông tin tài khoản</h4>
                                <p>Thông tin đăng nhập của người dùng</p>
                            </div>

                        </div>


                        <div class="user-form-grid">

                            <!-- USERNAME -->

                            <div class="user-form-group">

                                <label for="username">
                                    Tên đăng nhập
                                    <span class="required">*</span>
                                </label>

                                <div class="user-input-wrapper">

                                    <i class="fa fa-user user-input-icon"></i>

                                    <input
                                            id="username"
                                            type="text"
                                            th:field="*{username}"
                                            class="user-form-control"
                                            placeholder="Nhập tên đăng nhập"
                                            autocomplete="username">

                                </div>

                                <div
                                        th:if="${#fields.hasErrors('username')}"
                                        class="user-field-error"
                                        th:errors="*{username}">
                                </div>

                            </div>


                            <!-- EMAIL -->

                            <div class="user-form-group">

                                <label for="email">
                                    Email
                                </label>

                                <div class="user-input-wrapper">

                                    <i class="fa fa-envelope-o user-input-icon"></i>

                                    <input
                                            id="email"
                                            type="email"
                                            th:field="*{email}"
                                            class="user-form-control"
                                            placeholder="example@email.com"
                                            autocomplete="email">

                                </div>

                                <div
                                        th:if="${#fields.hasErrors('email')}"
                                        class="user-field-error"
                                        th:errors="*{email}">
                                </div>

                            </div>


                            <!-- PASSWORD -->

                            <div class="user-form-group user-form-group-full">

                                <label for="password">
                                    Mật khẩu
                                </label>

                                <div class="user-input-wrapper">

                                    <i class="fa fa-lock user-input-icon"></i>

                                    <input
                                            id="password"
                                            type="password"
                                            th:field="*{password}"
                                            class="user-form-control"
                                            placeholder="Nhập mật khẩu mới nếu muốn thay đổi"
                                            autocomplete="new-password">

                                </div>

                                <small class="user-form-hint">
                                    <i class="fa fa-info-circle"></i>
                                    Để trống nếu bạn không muốn thay đổi mật khẩu hiện tại.
                                </small>

                                <div
                                        th:if="${#fields.hasErrors('password')}"
                                        class="user-field-error"
                                        th:errors="*{password}">
                                </div>

                            </div>

                        </div>

                    </div>


                    <!-- =================================================
                         PERMISSION / STATUS
                         ================================================= -->

                    <div class="user-form-section">

                        <div class="user-form-section-title">

                            <div class="user-section-icon">
                                <i class="fa fa-shield"></i>
                            </div>

                            <div>
                                <h4>Phân quyền & trạng thái</h4>
                                <p>Cấu hình quyền truy cập của tài khoản</p>
                            </div>

                        </div>


                        <div class="user-form-grid">

                            <!-- ROLE -->

                            <div class="user-form-group">

                                <label for="roleId">
                                    Vai trò
                                    <span class="required">*</span>
                                </label>

                                <div class="user-input-wrapper">

                                    <i class="fa fa-shield user-input-icon"></i>

                                    <select
                                            id="roleId"
                                            th:field="*{roleId}"
                                            class="user-form-control user-form-select">

                                        <option value="">
                                            -- Chọn vai trò --
                                        </option>

                                        <option
                                                th:each="role : ${roles}"
                                                th:value="${role.id}"
                                                th:text="${role.name}">
                                        </option>

                                    </select>

                                </div>

                                <div
                                        th:if="${#fields.hasErrors('roleId')}"
                                        class="user-field-error"
                                        th:errors="*{roleId}">
                                </div>

                            </div>


                            <!-- STATUS -->

                            <div class="user-form-group">

                                <label for="enabled">
                                    Trạng thái
                                    <span class="required">*</span>
                                </label>

                                <div class="user-input-wrapper">

                                    <i class="fa fa-toggle-on user-input-icon"></i>

                                    <select
                                            id="enabled"
                                            th:field="*{enabled}"
                                            class="user-form-control user-form-select">

                                        <option value="true">
                                            Hoạt động
                                        </option>

                                        <option value="false">
                                            Khóa
                                        </option>

                                    </select>

                                </div>

                                <div
                                        th:if="${#fields.hasErrors('enabled')}"
                                        class="user-field-error"
                                        th:errors="*{enabled}">
                                </div>

                            </div>

                        </div>

                    </div>


                    <!-- =================================================
                         FORM ACTIONS
                         ================================================= -->

                    <div class="user-form-actions">

                        <a
                                th:href="@{/admin/users}"
                                class="user-btn user-btn-cancel">

                            <i class="fa fa-arrow-left"></i>

                            Hủy

                        </a>


                        <!-- LƯU -->

                        <button type="submit"
                                class="category-btn category-btn-save">

                            <i class="fa fa-save"></i>

                            <span>
                                Lưu thay đổi
                            </span>

                        </button>

                    </div>

                </form>

            </div>


            <!-- =================================================
                 FOOTER
                 ================================================= -->

            <div
                    th:replace="admin/fragments/footer :: footer">
            </div>

        </section>

    </section>

</section>

<!-- =====================================================
     JAVASCRIPT
     ===================================================== -->

<script
        th:replace="admin/fragments/script :: script">
</script>

</body>

</html>
