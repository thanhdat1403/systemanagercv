    <link rel="stylesheet"

    <!-- =========================================================

         ========================================================= -->

    <link th:href="@{/assets/css/style-responsive.css}"

         FONT CSS

          rel="stylesheet"

         FONT AWESOME

<body>

<div class="log-w3">

    <div class="w3layouts-main">

        <h2>Sign In Now</h2>

        <!--
            =====================================================
            JWT LOGIN
            =====================================================

            Login hiện tại sử dụng JWT.

            Không sử dụng:

                th:action="@{/login}"

            vì form login được xử lý bằng JavaScript.

            JavaScript sẽ gọi:

                POST /api/v1/auth/login

            Server sẽ:

                1. Kiểm tra username/password
                2. Xác thực tài khoản
                3. Tạo JWT
                4. Đưa JWT vào HttpOnly Cookie "accessToken"

            Sau khi login thành công:

                Browser tự động lưu Cookie "accessToken"

            Sau đó JavaScript chuyển người dùng tới:

                /dashboard

            Tất cả các role:

                ADMIN
                HR
                TECH_LEAD
                EMPLOYEE

            đều sử dụng Dashboard chung.

            Việc kiểm tra quyền truy cập /dashboard
            được thực hiện bởi Spring Security.
        -->


        <!-- =====================================================
             LOGIN FORM
             ===================================================== -->

        <form id="loginForm">

            <!-- =================================================
                 USERNAME
                 ================================================= -->

            <input type="text"
                   id="username"
                   class="ggg"
                   name="username"
                   placeholder="USERNAME"
                   required>


            <!-- =================================================
                 PASSWORD
                 ================================================= -->

            <input type="password"
                   id="password"
                   class="ggg"
                   name="password"
                   placeholder="PASSWORD"
                   required>


            <!-- =================================================
                 REMEMBER ME
                 ================================================= -->

            <span>

                <input type="checkbox"
                       id="rememberMe">

                Remember Me

            </span>


            <!-- =================================================
                 FORGOT PASSWORD
                 ================================================= -->

            <h6>

                <a href="#">
                    Forgot Password?
                </a>

            </h6>


            <div class="clearfix"></div>


            <!-- =================================================
                 SUBMIT
                 ================================================= -->

            <input type="submit"
                   value="Sign In"
                   name="login">


            <!-- =================================================
                 LOGIN ERROR
                 ================================================= -->

            <div id="loginError"
                 style="display: none;
                        color: red;
                        margin-top: 15px;">
            </div>

        </form>


        <!-- =====================================================
             REGISTER
             ===================================================== -->

        <p>

            Don't Have an Account ?

            <a th:href="@{/register}">
                Create an account
            </a>

        </p>

    </div>

</div>

     BOOTSTRAP

<!-- =========================================================
     JWT LOGIN JAVASCRIPT
     ========================================================= -->

<script>

    /*
     * =========================================================
     * LOGIN FORM
     * =========================================================
     *
     * Khi người dùng submit form:
     *
     *     1. Không cho HTML tự submit tới /login
     *     2. Gọi REST API:
     *
     *          POST /api/v1/auth/login
     *
     *     3. Nếu login thành công:
     *
     *          Server tạo JWT
     *          Server lưu JWT vào HttpOnly Cookie
     *
     *     4. Browser chuyển tới:
     *
     *          /dashboard
     *
     * =========================================================
     */


    document.getElementById("loginForm")
        .addEventListener("submit", async function (event) {


            /*
             * =====================================================
             * BƯỚC 1
             * Ngăn HTML form tự POST tới /login
             * =====================================================
             */

            event.preventDefault();


            /*
             * =====================================================
             * BƯỚC 2
             * Lấy username/password
             * =====================================================
             */

            const username =
                document.getElementById("username")
                    .value
                    .trim();


            const password =
                document.getElementById("password")
                    .value;


            /*
             * =====================================================
             * Khu vực hiển thị lỗi
             * =====================================================
             */

            const loginError =
                document.getElementById("loginError");


            /*
             * =====================================================
             * Xóa lỗi cũ
             * =====================================================
             */

            loginError.style.display = "none";

            loginError.textContent = "";


            try {


                /*
                 * =================================================
                 * BƯỚC 3
                 * Gọi API LOGIN
                 * =================================================
                 *
                 * API:
                 *
                 *     POST /api/v1/auth/login
                 *
                 * Body:
                 *
                 * {
                 *     "username": "...",
                 *     "password": "..."
                 * }
                 *
                 * Server sẽ xử lý Authentication.
                 */

                const response =
                    await fetch(
                        "/api/v1/auth/login",
                        {
                            method: "POST",

                            headers: {
                                "Content-Type": "application/json"
                            },

                            body: JSON.stringify({
                                username: username,
                                password: password
                            })
                        }
                    );


                /*
                 * =================================================
                 * BƯỚC 4
                 * Đọc response JSON
                 * =================================================
                 */

                const result =
                    await response.json();


                /*
                 * =================================================
                 * BƯỚC 5
                 * Kiểm tra LOGIN thất bại
                 * =================================================
                 */

                if (!response.ok) {

                    loginError.textContent =
                        result.message ||
                        "Đăng nhập thất bại.";

                    loginError.style.display =
                        "block";

                    return;
                }


                /*
                 * =================================================
                 * BƯỚC 6
                 * LOGIN THÀNH CÔNG
                 * =================================================
                 *
                 * Server đã xử lý:
                 *
                 *     username/password
                 *            ↓
                 *     Authentication
                 *            ↓
                 *          JWT
                 *            ↓
                 *     HttpOnly Cookie
                 *
                 * Cookie:
                 *
                 *     accessToken
                 *
                 * Browser sẽ tự động lưu Cookie.
                 *
                 * Không lưu JWT vào localStorage.
                 */


                const loginData =
                    result.data;


                /*
                 * =================================================
                 * BƯỚC 7
                 * Lấy roles từ response
                 * =================================================
                 *
                 * roles chỉ được dùng để kiểm tra
                 * tài khoản đã được cấp role hay chưa.
                 *
                 * Không dùng role để redirect sang
                 * các dashboard riêng biệt nữa.
                 *
                 * Tất cả role đều dùng:
                 *
                 *     /dashboard
                 */

                const roles =
                    loginData.roles;


                /*
                 * =================================================
                 * BƯỚC 8
                 * Kiểm tra tài khoản có ROLE hay không
                 * =================================================
                 */

                if (!roles ||
                    !Array.isArray(roles) ||
                    roles.length === 0) {

                    loginError.textContent =
                        "Tài khoản chưa được cấp quyền.";

                    loginError.style.display =
                        "block";

                    return;
                }


                /*
                 * =================================================
                 * BƯỚC 9
                 * CHUYỂN TỚI DASHBOARD CHUNG
                 * =================================================
                 *
                 * Không còn:
                 *
                 *     /admin/index
                 *     /hr/index
                 *     /tech-lead/index
                 *     /employee/index
                 *
                 * Tất cả role đều đi tới:
                 *
                 *     /dashboard
                 *
                 * Sau đó Spring Security sẽ kiểm tra:
                 *
                 *     ADMIN
                 *     HR
                 *     TECH_LEAD
                 *     EMPLOYEE
                 *
                 * thông qua SecurityConfig.
                 */

                window.location.href =
                    "/dashboard";


            } catch (error) {


                /*
                 * =================================================
                 * BƯỚC 10
                 * LỖI KẾT NỐI SERVER
                 * =================================================
                 */

                console.error(
                    "Login error:",
                    error
                );


                loginError.textContent =
                    "Không thể kết nối tới máy chủ.";


                loginError.style.display =
                    "block";

            }

        });

</script>


</body>
